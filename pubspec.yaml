name: taha_portfolio
description: A Flutter portfolio website for Taha
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Animation
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.10

  # Icons
  lucide_icons: ^0.257.0

  # Utilities
  url_launcher: ^6.3.2
  intl: ^0.19.0

  # State Management (optional)
  provider: ^6.1.2

  # Firebase
  firebase_core: ^2.25.4
  firebase_analytics: ^10.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/